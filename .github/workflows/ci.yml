name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Build without native sound
        run: cargo build --release --no-default-features --target-dir target/plain
      - name: Help runs
        run: ./target/release/vocsend help > /dev/null
