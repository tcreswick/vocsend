name: Release

# Push a tag such as v0.1.0 to build binaries for every system and publish
# them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the target
        run: rustup target add ${{ matrix.target }}
      - name: Install the ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          dir="vocsend-${{ github.ref_name }}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/vocsend" README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "vocsend-${{ github.ref_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vocsend.exe", README.md, LICENSE $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            vocsend-*.tar.gz
            vocsend-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum vocsend-* > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "vocsend ${{ github.ref_name }}" --generate-notes vocsend-* SHA256SUMS
