[package]
name = "vocsend"
version = "1.0.1"
edition = "2021"
authors = ["Tim Creswick"]
description = "Send small amounts of data between computers by sound, through noise suppression"
license = "MIT"
repository = "https://github.com/tcreswick/vocsend"
readme = "README.md"
keywords = ["audio", "modem", "air-gap", "data-transfer"]
categories = ["command-line-utilities"]

# Encryption, hashing and compression come from widely used pure-Rust
# libraries. The signal processing and error correction are in this repository.
[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
cpal = { version = "0.18.2", optional = true }
flate2 = "1.1.11"
getrandom = "0.4.3"
rpassword = { version = "7.5.5", optional = true }
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# native-audio: talk to the system's sound devices directly. Without it
# (cargo build --no-default-features --features cli) vocsend needs no system
# libraries to build, and uses command-line players and recorders instead.
default = ["cli", "native-audio"]
# The command-line program. Leave it out to use vocsend as a library, for
# example in a browser, where there is no terminal or sound card to talk to.
cli = ["dep:rpassword"]
native-audio = ["cli", "dep:cpal"]

[[bin]]
name = "vocsend"
path = "src/main.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
